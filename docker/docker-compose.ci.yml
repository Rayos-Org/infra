
services:
  postgres:
    image: postgres:16-alpine
    container_name: rayos_postgres_ci
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: relay_dev
    networks:
      - rayos_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relay_dev"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rayos_redis_ci
    networks:
      - rayos_ci
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

networks:
  rayos_ci:
    driver: bridge


