receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  resource:
    attributes:
      - key: service.namespace
        value: "rayos"
        action: upsert
      - key: deployment.environment
        from_attribute: DEPLOYMENT_ENV
        action: insert
exporters:
  otlphttp/grafana:
    endpoint: "${GRAFANA_OTLP_ENDPOINT}"
    headers:
      authorization: "Basic ${GRAFANA_OTLP_AUTH}"
  logging:
    verbosity: normal
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/grafana, logging]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/grafana]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/grafana, logging]
